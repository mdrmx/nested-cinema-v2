<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Operator</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 16px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      button {
        padding: 10px 12px;
      }
      input[type="range"] {
        width: 520px;
      }
      #t {
        font-variant-numeric: tabular-nums;
      }
      #cueList {
        margin-top: 8px;
        border-collapse: collapse;
        width: 100%;
      }
      #cueList th,
      #cueList td {
        text-align: left;
        padding: 4px 8px;
        border-bottom: 1px solid #ddd;
        font-size: 0.9em;
      }
      #cueList th {
        font-weight: 600;
      }
      #cueList td[data-editable] {
        cursor: pointer;
      }
      #cueList td[data-editable]:hover {
        background: #f0f4ff;
      }
      #cueList td input,
      #cueList td select {
        font: inherit;
        padding: 2px 4px;
      }
    </style>
  </head>
  <body>
    <h2>Operator</h2>

    <div class="row">
      <button id="play">Play</button>
      <button id="pause">Pause</button>
      <button id="stop">Stop</button>
      <span id="t">t=0.00</span>
    </div>

    <div class="row">
      <input id="seek" type="range" min="0" max="600" step="0.01" value="0" />
    </div>

    <div class="row">
      <label>Duration:</label>
      <input id="dur" type="number" value="600" min="1" step="1" />
      <button id="setDur">Set</button>
    </div>

    <hr />
    <h3>VR Cues</h3>

    <table id="cueList">
      <thead>
        <tr>
          <th>Time (s)</th>
          <th>Type</th>
          <th>Clip</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="cueListBody"></tbody>
      <tfoot>
        <tr>
          <td colspan="4"><button id="addCueBtn">+ Add Cue</button></td>
        </tr>
      </tfoot>
    </table>

    <hr />
    <h3>Screen video assignment</h3>
    <div id="screenAssign"></div>

    <script src="./controls.js"></script>
  </body>
</html>
